name: Package tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            illuminate: '^10.0'
          - php: '8.5'
            illuminate: '^10.0'
          - php: '8.2'
            illuminate: '^11.0'
          - php: '8.2'
            illuminate: '^12.0'
          - php: '8.5'
            illuminate: '^12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, xml, zip
          coverage: none
      - name: Resolve the selected Laravel component version
        run: >-
          composer update
          --with="illuminate/config:${{ matrix.illuminate }}"
          --with="illuminate/container:${{ matrix.illuminate }}"
          --with="illuminate/filesystem:${{ matrix.illuminate }}"
          --with="illuminate/http:${{ matrix.illuminate }}"
          --with="illuminate/support:${{ matrix.illuminate }}"
          --with-all-dependencies
          --prefer-dist
          --no-interaction
          --no-progress
      - name: Run tests
        run: composer test
